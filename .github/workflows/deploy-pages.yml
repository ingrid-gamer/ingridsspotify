name: Deploy DJ Ingrid Stats

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - js/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar sitio estático
        run: |
          mkdir public
          cp index.html public/index.html
          cp -r js public/js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
