<script>
'use strict';
const SUPABASE_URL = 'https://zbovgcnqoavnmlybkhfj.supabase.co';
const DEFAULT_COVER = 'https://placehold.co/600x600/181818/FFFFFF?text=Sin+portada';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_fQCiU8IUCf3PpfzVWiHQSg_qN7y_4Ra';
const RECENT_REFRESH_MS = 10000;
const STATS_REFRESH_MS = 5 * 60 * 1000;
const coverCache = new Map();

function validateFrontendConfig() {
    if (!SUPABASE_URL.trim() || !SUPABASE_PUBLISHABLE_KEY.trim() || /^(TU_|YOUR_)/i.test(SUPABASE_PUBLISHABLE_KEY.trim())) {
        throw new Error('Configura SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY en index.html.');
    }
}
function escapeHTML(value) {
    return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function safeNumber(value) { const n = Number(value); return Number.isFinite(n) ? n : 0; }
function formatNumber(value) { return safeNumber(value).toLocaleString('es-CL'); }
function formatRelativeTime(playedAt) {
    if (!playedAt) return '';
    const date = new Date(playedAt);
    if (Number.isNaN(date.getTime())) return '';
    const mins = Math.max(0, Math.floor((Date.now() - date.getTime()) / 60000));
    if (mins < 1) return 'hace menos de un minuto';
    if (mins < 60) return `hace ${mins} ${mins === 1 ? 'minuto' : 'minutos'}`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `hace ${hours} ${hours === 1 ? 'hora' : 'horas'}`;
    const days = Math.floor(hours / 24);
    return `hace ${days} ${days === 1 ? 'día' : 'días'}`;
}
function getSpotifyUrl(value) {
    if (!value || typeof value !== 'string') return '';
    const v = value.trim();
    if (/^https?:\/\//i.test(v)) return v;
    const match = v.match(/^spotify:(track|album):([A-Za-z0-9]+)$/i);
    return match ? `https://open.spotify.com/${match[1].toLowerCase()}/${match[2]}` : '';
}
function spotifyLink(value) { return getSpotifyUrl(value); }
async function fetchJson(url, options = {}, timeoutMs = 10000) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), timeoutMs);
    try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        const text = await response.text();
        let body = {};
        try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text }; }
        if (!response.ok) {
            const detail = body?.message || body?.details || body?.hint || body?.code || body?.raw || '';
            throw new Error(`HTTP ${response.status}${detail ? ` — ${detail}` : ''}`);
        }
        return body;
    } finally { clearTimeout(timeout); }
}
function normalizeText(value) {
    return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}
async function querySpotifyOEmbed(value) {
    const url = getSpotifyUrl(value);
    if (!url) return null;
    try {
        const data = await fetchJson(`https://open.spotify.com/oembed?url=${encodeURIComponent(url)}`, {}, 9000);
        return data?.thumbnail_url ? { cover: data.thumbnail_url, title: data.title || null } : null;
    } catch (e) { console.warn('Spotify oEmbed no respondió:', e.message); return null; }
}
async function queryItunesStrict(artist, titleOrAlbum, mode = 'song') {
    if (!artist && !titleOrAlbum) return null;
    try {
        const query = encodeURIComponent(`${artist || ''} ${titleOrAlbum || ''}`.trim());
        const entity = mode === 'album' ? 'album' : 'song';
        const data = await fetchJson(`https://itunes.apple.com/search?term=${query}&entity=${entity}&limit=15&country=CL`, {}, 9000);
        const results = Array.isArray(data.results) ? data.results : [];
        const artistKey = normalizeText(artist), targetKey = normalizeText(titleOrAlbum);
        const scored = results.map(item => {
            const itemArtist = normalizeText(item.artistName || '');
            const itemTitle = normalizeText(mode === 'album' ? (item.collectionName || '') : (item.trackName || ''));
            let score = 0;
            if (artistKey && itemArtist === artistKey) score += 10;
            else if (artistKey && (itemArtist.includes(artistKey) || artistKey.includes(itemArtist))) score += 4;
            if (targetKey && itemTitle === targetKey) score += 10;
            else if (targetKey && (itemTitle.includes(targetKey) || targetKey.includes(itemTitle))) score += 3;
            return { item, score };
        }).sort((a,b) => b.score - a.score);
        const best = scored[0];
        if (!best || best.score < 14) return null;
        const art = best.item.artworkUrl100;
        return { cover: art ? art.replace(/\d+x\d+bb/, '600x600bb') : null, releaseYear: best.item.releaseDate ? String(best.item.releaseDate).slice(0,4) : null };
    } catch (e) { console.warn('iTunes no respondió:', e.message); return null; }
}
async function queryDeezerStrict(artist, title) {
    if (!artist && !title) return null;
    try {
        const query = encodeURIComponent(`${artist || ''} ${title || ''}`.trim());
        const data = await fetchJson(`https://corsproxy.io/?url=${encodeURIComponent(`https://api.deezer.com/search?q=${query}&limit=10`)}`, {}, 9000);
        const results = Array.isArray(data?.data) ? data.data : [];
        const artistKey = normalizeText(artist), titleKey = normalizeText(title);
        const scored = results.map(item => {
            const a = normalizeText(item?.artist?.name || ''), t = normalizeText(item?.title || '');
            let score = 0;
            if (a === artistKey) score += 10; else if (artistKey && a.includes(artistKey)) score += 4;
            if (t === titleKey) score += 10; else if (titleKey && t.includes(titleKey)) score += 3;
            return { item, score };
        }).sort((a,b) => b.score - a.score);
        const best = scored[0];
        return best && best.score >= 14 ? (best.item?.album?.cover_xl || best.item?.album?.cover_big || null) : null;
    } catch (e) { console.warn('Deezer no respondió:', e.message); return null; }
}
async function fetchMetadata(artist, title, spotifyValue, isAlbum) {
    const kind = isAlbum ? 'album' : 'track';
    const key = `${kind}|||${normalizeText(artist)}|||${normalizeText(title)}|||${normalizeText(spotifyValue)}`;
    if (coverCache.has(key)) return coverCache.get(key);
    let result = null;
    const spotify = await querySpotifyOEmbed(spotifyValue);
    if (spotify?.cover) result = { cover: spotify.cover, releaseYear: null };
    if (!result?.cover) result = await queryItunesStrict(artist, title, isAlbum ? 'album' : 'song');
    if (!result?.cover && !isAlbum) {
        const deezer = await queryDeezerStrict(artist, title);
        if (deezer) result = { cover: deezer, releaseYear: null };
    }
    if (!result?.cover) result = { cover: DEFAULT_COVER, releaseYear: result?.releaseYear || null };
    coverCache.set(key, result);
    return result;
}
// Use the cover stored in Supabase when it loads. Only look up another source when absent or broken.
async function resolveCover(imgId, artist, title, spotifyValue = '', isAlbum = false, forceLookup = false) {
    const img = document.getElementById(imgId);
    if (!img) return null;
    if (!forceLookup && img.dataset.savedCover && img.dataset.savedCover !== DEFAULT_COVER) return { cover: img.dataset.savedCover, releaseYear: null };
    const metadata = await fetchMetadata(artist, title, spotifyValue, isAlbum);
    const current = document.getElementById(imgId);
    if (current && metadata?.cover) current.src = metadata.cover;
    return metadata;
}
function handleCoverError(img) {
    if (!img || img.dataset.lookupStarted === 'true') {
        if (img) img.src = DEFAULT_COVER;
        return;
    }
    img.dataset.lookupStarted = 'true';
    img.src = DEFAULT_COVER;
    resolveCover(img.id, img.dataset.artist || '', img.dataset.title || '', img.dataset.spotify || '', img.dataset.kind === 'album', true).then(metadata => {
        const current = document.getElementById(img.id);
        if (current && metadata?.cover && metadata.cover !== DEFAULT_COVER) current.src = metadata.cover;
    }).catch(e => console.warn('No se pudo recuperar una portada:', e.message));
}
function imageAttributes(id, cover, artist, title, spotifyValue, isAlbum) {
    const usableCover = cover && typeof cover === 'string' ? cover : DEFAULT_COVER;
    return `id="${escapeHTML(id)}" src="${escapeHTML(usableCover)}" data-saved-cover="${escapeHTML(usableCover)}" data-artist="${escapeHTML(artist || '')}" data-title="${escapeHTML(title || '')}" data-spotify="${escapeHTML(spotifyValue || '')}" data-kind="${isAlbum ? 'album' : 'track'}" alt="Portada" onerror="handleCoverError(this)"`;
}
function renderTrackList(containerId, rows, showPlays = false) {
    const container = document.getElementById(containerId);
    if (!container) return;
    if (!Array.isArray(rows) || rows.length === 0) { container.innerHTML = '<p class="text-sm text-gray-500 p-2">No se encontraron datos.</p>'; return; }
    container.innerHTML = rows.map((row, index) => {
        const rawTitle = row.track_name || 'Canción desconocida';
        const rawArtist = row.artist_name || 'Artista desconocido';
        const title = escapeHTML(rawTitle), artist = escapeHTML(rawArtist);
        const album = row.album_name ? `${escapeHTML(row.album_name)}, ` : '';
        const plays = showPlays ? formatNumber(row.veces_reproducidas) : '';
        const link = spotifyLink(row.spotify_url || row.spotify_track_uri);
        const relativeTime = formatRelativeTime(row.played_at);
        const imgId = `img-track-${containerId}-${index}`;
        const left = relativeTime
            ? `<div class="recent-time text-xs text-gray-500 flex flex-col items-center justify-center w-28 text-center shrink-0"><span>${escapeHTML(relativeTime)}</span></div>`
            : `<div class="text-lg font-bold text-gray-500 w-8 text-center shrink-0">${index + 1}</div>`;
        const titleHtml = link
            ? `<a href="${escapeHTML(link)}" target="_blank" rel="noopener noreferrer" class="track-title-link text-base font-bold text-gray-900 underline decoration-spotify/60 underline-offset-2 hover:text-spotify truncate">${title}</a>`
            : `<h3 class="text-base font-bold text-gray-900 truncate">${title}</h3>`;
        const playsHtml = showPlays ? `<div class="text-xs font-bold text-gray-900 mr-1 whitespace-nowrap shrink-0">${plays} <span class="text-gray-500 font-normal">plays</span></div>` : '';
        const artAttrs = imageAttributes(imgId, row.album_cover, rawArtist, rawTitle, row.spotify_url || row.spotify_track_uri, false);
        return `<div class="recent-row flex items-center gap-3 p-2 rounded-md hover:bg-cardHover transition-colors">${left}<div class="flex-1 min-w-0 flex flex-col text-right pr-1">${titleHtml}<p class="text-sm text-lightText truncate">${album}${artist}</p></div>${playsHtml}<img ${artAttrs} class="w-14 h-14 rounded bg-gray-200 object-cover flex-shrink-0" loading="lazy"></div>`;
    }).join('');
    rows.forEach((row, index) => {
        const img = document.getElementById(`img-track-${containerId}-${index}`);
        if (img && (!row.album_cover || row.album_cover === DEFAULT_COVER)) {
            resolveCover(img.id, row.artist_name, row.track_name, row.spotify_url || row.spotify_track_uri || '', false, true).catch(e => console.warn(e));

function renderAlbumList(containerId, rows) {

        const album = escapeHTML(rawAlbum), artistRaw = row.artist_name || 'Artista desconocido';

        const imgId = `img-album-${containerId}-${index}`;
        const artAttrs = imageAttributes(imgId, row.album_cover, artistRaw, rawAlbum, row.spotify_url || row.spotify_album_uri || row.spotify_track_uri || '', true);
        return `<div class="min-w-0 overflow-hidden rounded-lg border border-gray-200 bg-white hover:border-spotify/50 transition-colors"><div class="relative aspect-square bg-gray-100"><img ${artAttrs} class="w-full h-full object-cover" loading="lazy"><span class="absolute top-2 left-2 rounded bg-white/95 px-2 py-0.5 text-xs font-bold text-gray-700 shadow">#${index + 1}</span></div><div class="p-3 min-w-0"><h3 class="text-sm font-bold text-gray-900 leading-snug">${album}${yearHtml}</h3><p class="text-xs text-lightText truncate mt-1">${artist}</p><p class="text-xs font-semibold text-gray-700 mt-2">${plays} <span class="font-normal text-gray-500">plays</span></p></div></div>`;

        const img = document.getElementById(`img-album-${containerId}-${index}`);
        if (img && (!row.album_cover || row.album_cover === DEFAULT_COVER)) {
            resolveCover(img.id, row.artist_name, row.album_name, row.spotify_url || row.spotify_album_uri || row.spotify_track_uri || '', true, true).then(metadata => {
                const yearEl = document.getElementById(`year-album-${containerId}-${index}`);
                if (yearEl && !yearEl.textContent.trim() && metadata?.releaseYear && /^(19|20)\d{2}$/.test(String(metadata.releaseYear))) yearEl.textContent = `(${metadata.releaseYear})`;
            }).catch(e => console.warn(e));
        }
    });
}
async function queryView(viewName) {
    validateFrontendConfig();
    const endpoint = `${SUPABASE_URL}/rest/v1/${encodeURIComponent(viewName)}?select=*`;
    const data = await fetchJson(endpoint, { method: 'GET', headers: { apikey: SUPABASE_PUBLISHABLE_KEY, Accept: 'application/json' }, cache: 'no-store' });
    if (!Array.isArray(data)) throw new Error(`${viewName}: la respuesta no es una lista válida.`);
    return data;
}
const statsSections = [
    {
        id: 'top-canciones-90',
        view: 'view_top_tracks_recent',
        containerId: 'container-top-canciones-90',
        limit: 10,
        render: rows => renderTrackList('container-top-canciones-90', rows, true)
    },
    {
        id: 'top-albumes-90',
        view: 'view_top_albums_recent',
        containerId: 'container-top-albumes-90',
        limit: 5,
        render: rows => renderAlbumList('container-top-albumes-90', rows)
    },
    {
        id: 'top-canciones-all',
        view: 'view_top_tracks_all_time',
        containerId: 'container-top-canciones-all',
        limit: 10,
        render: rows => renderTrackList('container-top-canciones-all', rows, true)
    },
    {
        id: 'top-albumes-all',
        view: 'view_top_albums_all_time',
        containerId: 'container-top-albumes-all',
        limit: 5,
        render: rows => renderAlbumList('container-top-albumes-all', rows)
    }
];
const statsSectionState = new Map(
    statsSections.map(section => [section.id, { loaded: false, promise: null, rows: null }])
);
function renderStatsSection(section, rows) {
    section.render(rows.slice(0, section.limit));
}
function showStatsSectionLoading(container) {
    container.innerHTML = '<div class="flex items-center justify-center gap-3 p-6 text-sm text-gray-600" role="status" aria-live="polite"><span class="stats-loading-spinner" aria-hidden="true"></span><span>Cargando estadísticas...</span></div>';
}
function showStatsSectionError(section, error) {
    const container = document.getElementById(section.containerId);
    if (!container) return;
    const message = error instanceof Error ? error.message : String(error);
    container.innerHTML = `<div class="rounded-lg border border-red-200 bg-red-50 p-4" role="alert"><p class="text-sm font-semibold text-red-700">No se pudieron cargar estas estadísticas.</p><p class="mt-1 text-xs text-red-600">${escapeHTML(message)}</p><button type="button" data-retry-section="${escapeHTML(section.id)}" class="mt-3 rounded-full bg-gray-900 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-spotify focus:ring-offset-2">Reintentar</button></div>`;
}
async function loadStatsSection(section) {
    const state = statsSectionState.get(section.id);
    const container = document.getElementById(section.containerId);
    if (!state || !container || state.loaded) return;
    if (state.promise) return state.promise;

    showStatsSectionLoading(container);
    state.promise = (async () => {
        try {
            const rows = await queryView(section.view);
            state.rows = rows;
            state.loaded = true;
            renderStatsSection(section, rows);
        } catch (error) {
            console.error(`Error cargando ${section.view}:`, error);
            showStatsSectionError(section, error);
        } finally {
            state.promise = null;
        }
    })();
    return state.promise;
}
function initStatsAccordions() {
    for (const section of statsSections) {
        const button = document.getElementById(`toggle-${section.id}`);
        const panel = document.getElementById(`panel-${section.id}`);
        const container = document.getElementById(section.containerId);
        if (!button || !panel || !container) continue;

        button.addEventListener('click', () => {
            const isOpen = button.getAttribute('aria-expanded') === 'true';
            const shouldOpen = !isOpen;
            button.setAttribute('aria-expanded', String(shouldOpen));
            panel.dataset.open = String(shouldOpen);
            panel.setAttribute('aria-hidden', String(!shouldOpen));
            panel.inert = !shouldOpen;
            if (shouldOpen) loadStatsSection(section);
        });

        container.addEventListener('click', event => {
            const retryButton = event.target.closest?.('[data-retry-section]');
            if (retryButton?.dataset.retrySection === section.id) loadStatsSection(section);
        });
    }
}
async function refreshOpenStatsSections() {
    for (const section of statsSections) {
        const state = statsSectionState.get(section.id);
        const panel = document.getElementById(`panel-${section.id}`);
        if (!state?.loaded || state.promise || panel?.dataset.open !== 'true') continue;
        state.promise = (async () => {
            try {
                const rows = await queryView(section.view);
                state.rows = rows;
                renderStatsSection(section, rows);
            } catch (error) {
                console.warn(`No se pudo actualizar ${section.view}:`, error);
            } finally {
                state.promise = null;
            }
        })();
    }
}
function sortRecentPlays(rows) {
    return [...rows].sort((a,b) => {
        const da = new Date(a.played_at || 0).getTime(), db = new Date(b.played_at || 0).getTime();
        if (db !== da) return db - da;
        return safeNumber(b.id) - safeNumber(a.id);
    });
}
const RECENT_INITIAL_COUNT = 5;
const RECENT_MORE_COUNT = 10;
let recentRows = [];
let recentRowsFingerprint = null;
let recentVisibleCount = RECENT_INITIAL_COUNT;
function renderRecentRows() {
    renderTrackList('container-recientes', recentRows.slice(0, recentVisibleCount), false);
    const button = document.getElementById('toggle-recientes');
    if (!button) return;
    const remainingCount = Math.max(0, recentRows.length - RECENT_INITIAL_COUNT);
    button.hidden = remainingCount === 0;
    const expanded = recentVisibleCount > RECENT_INITIAL_COUNT;
    button.setAttribute('aria-expanded', String(expanded));
    button.textContent = expanded ? 'ver menos' : 'ver más';
}
async function cargarRecientes() {
    const container = document.getElementById('container-recientes');
    const firstLoad = !container?.dataset.loaded;
    try {
        const rows = sortRecentPlays(await queryView('view_recent_plays')).slice(0, RECENT_INITIAL_COUNT + RECENT_MORE_COUNT);
        const fingerprint = JSON.stringify(rows);
        recentRows = rows;
        if (fingerprint !== recentRowsFingerprint) {
            recentRowsFingerprint = fingerprint;
            renderRecentRows();
        }
        if (container) container.dataset.loaded = 'true';
    } catch (error) {
        console.error('Error cargando reproducciones recientes:', error);
        if (firstLoad && container) container.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-lg p-4"><p class="text-sm text-red-700 font-semibold">No se pudieron cargar las reproducciones recientes.</p><p class="text-xs text-red-600 mt-1">${escapeHTML(error.message)}</p></div>`;
    }
}
async function cargarEstadisticas() {
    try {
        const stats = await queryView('view_stats_general');
        if (stats.length) {
            document.getElementById('stat-reproducciones').innerText = formatNumber(stats[0].total_plays);
            document.getElementById('stat-artistas').innerText = formatNumber(stats[0].total_artistas);
        }
    } catch (error) {
        console.error('Error al cargar estadísticas de Supabase:', error);
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    initStatsAccordions();
    document.getElementById('toggle-recientes')?.addEventListener('click', () => {
        recentVisibleCount = recentVisibleCount > RECENT_INITIAL_COUNT
            ? RECENT_INITIAL_COUNT
            : Math.min(RECENT_INITIAL_COUNT + RECENT_MORE_COUNT, recentRows.length);
        renderRecentRows();
    });
    await cargarRecientes();
    cargarEstadisticas();
    setInterval(() => {
        cargarEstadisticas();
        refreshOpenStatsSections();
    }, STATS_REFRESH_MS);
    setInterval(cargarRecientes, RECENT_REFRESH_MS);
});
</script>
